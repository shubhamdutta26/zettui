[package]
name = "zettui"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A local-first terminal notes manager written in Rust"
license = "MIT"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
edtui = "=0.11.7"
tempfile = "3"
trash = "5.3"
rustix = { version = "1", features = ["fs"] }
