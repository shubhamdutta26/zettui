# Copy to ~/.config/zettui/config.toml; set your own paths.
# Place top-level settings before [colors].
notes_dir = "/home/USER/Documents/Notes"
bibliography = "/home/USER/Documents/Zotero/references.json"
theme = "auto"

# Width of the left (file browser) pane in percent (20..70).
# The right (editor/preview) pane fills the remainder.
browser_width_percent = 35

# Optional color overrides. Can be omitted entirely.
[colors]
# accent = "#FABD2F"
# directory = "#83A598"
