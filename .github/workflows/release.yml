name: Linux Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Install stable Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: rustfmt, clippy

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils file rpm cpio

      - name: Verify tag matches Cargo package version
        shell: bash
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo 'Cargo.lock must be committed before release'; exit 1; }
          version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' Cargo.toml | head -n 1)
          test -n "$version"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo package version $version"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Check and test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Build portable Linux binary
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/zettui

      - name: Create tarball, Debian and Fedora packages, Arch recipe, checksums
        shell: bash
        run: |
          bash scripts/package-linux.sh \
            target/x86_64-unknown-linux-musl/release/zettui "${VERSION}"
          bash scripts/verify-linux-packages.sh "${VERSION}"
          ls -lh dist/

      - name: Prepare release notes from changelog
        shell: bash
        run: |
          awk -v version="$VERSION" '
            $1 == "##" {
              if (found) exit
              if ($2 == version) found = 1
            }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > dist/RELEASE-NOTES.md
          test -s dist/RELEASE-NOTES.md

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/RELEASE-NOTES.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/zettui_${{ env.VERSION }}_linux_x86_64.tar.gz
            dist/zettui_${{ env.VERSION }}_linux_x86_64.deb
            dist/zettui_${{ env.VERSION }}_linux_x86_64.rpm
            dist/PKGBUILD
            dist/SHA256SUMS
