name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Require a committed Cargo.lock
        run: |
          test -f Cargo.lock || { echo 'Commit Cargo.lock: cargo generate-lockfile && git add Cargo.lock'; exit 1; }
      - name: Verify formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check --locked
      - name: Check code quality
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Build executable
        run: cargo build --release --locked
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items --locked
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools binutils file rpm cpio
      - name: Test Linux release packaging before tagging
        shell: bash
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          version=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p;}' Cargo.toml | head -n 1)
          bash scripts/package-linux.sh target/x86_64-unknown-linux-musl/release/zettui "$version"
          bash scripts/verify-linux-packages.sh "$version"
